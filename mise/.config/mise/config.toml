[tools]
bun = "1.4.3"
node = "24.20.0"
"npm:@anthropic-ai/claude-code" = "2.1.201"
"npm:@earendil-works/pi-coding-agent" = "0.74.2"
"npm:agent-react-devtools" = "0.4.0"
"npm:eas-cli" = "25"
"npm:vercel" = "latest"
pnpm = "10.19.0"
yarn = "4.6.0"
